version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel_main_app
    ports:
      - "3000:3000"
    restart: always
    working_dir: /var/www/html
    command: ["bash", "-c", "php artisan key:generate && php artisan serve --host=0.0.0.0 --port=3000"]
    volumes:
      - .:/var/www/html
